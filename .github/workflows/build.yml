name: Build Windows EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip app
        shell: pwsh
        run: Expand-Archive -Path tally-github-ready.zip -DestinationPath app
      - name: Build
        working-directory: app
        run: |
          npm install
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Tally-Windows
          path: app/dist/*.exe
